<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>เข้าสู่ระบบ — GRAD UP</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400..700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/login.css?v=20261125h" />
  </head>

  <body>
    <a class="login-back" href="index.html">
      <span aria-hidden="true">&lt;</span>
      <span>กลับหน้าหลัก</span>
    </a>
    <div class="login-layout">
      <!-- Welcome panel -->
      <aside class="login-side">
        <div class="login-side__inner">
        </div>
      </aside>

      <!-- Sign-in panel -->
      <main class="login-main">
        <div class="login-card">
          <div class="login-card__header">
            <div class="login-card__icon">
              <img src="assets/images/grad-logo.png" alt="GRAD UP" />
            </div>
            <h2 class="login-card__heading">ยินดีต้อนรับเข้าสู่</h2>
            <p class="login-card__subtitle">ระบบจัดการสารสนเทศบัณฑิตศึกษา (GRAD)<br />มหาวิทยาลัยพะเยา</p>
          </div>

          <a class="btn btn--msoffice btn--full" href="https://grad.up.ac.th/authen/Office365"
            target="_blank" rel="noopener noreferrer" title="เปิดหน้าล็อกอิน Office 365 ในแท็บใหม่">
            <span class="btn__icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M3 4.1 9 2v16l-6-2.1V4.1Z" fill="currentColor"/>
                <path d="M10 3h7v14h-7" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              </svg>
            </span>
            <span>Login with Office 365</span>
          </a>

          <div class="login-divider">
            <span class="login-divider__line"></span>
            <span class="login-divider__text">OR</span>
            <span class="login-divider__line"></span>
          </div>

          <div class="login-actions">
            <a class="btn btn--accent btn--full" href="https://intra.up.ac.th/account/wfrmForgetPassword.aspx">
              <span class="btn__icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8 3 3-2 2-2-2-2 2 2 2-3 3"/></svg>
              </span>
              Forget password
            </a>
            <a class="btn btn--gray btn--full" href="https://intra.up.ac.th/account/wfrmChangePassword.aspx">
              <span class="btn__icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              Change password
            </a>
          </div>
        </div>
      </main>
    </div>

    <script src="js/theme.js"></script>
  </body>
</html>
